<style>
/* ============================================================
   表情工坊 · GIF Studio — 样式
   设计语言：Apple / Linear 风格的产品工具 UI
   ============================================================ */

:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---------- 浅色 ---------- */
:root, [data-theme="light"] {
  --bg: #f5f5f7;
  --bg-deep: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f6f6f8;
  --surface-3: #ececf0;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.14);
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #9a9aa0;
  --accent: #0071e3;
  --accent-strong: #0064c8;
  --accent-soft: rgba(0, 113, 227, 0.10);
  --success: #34c759;
  --danger: #ff3b30;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.08);
  --shadow-pop: 0 8px 30px rgba(0, 0, 0, 0.16);
  --checker-a: #f0f0f2;
  --checker-b: #e2e2e8;
}

/* ---------- 深色 ---------- */
[data-theme="dark"] {
  --bg: #0b0b0d;
  --bg-deep: #060607;
  --surface: #1c1c1e;
  --surface-2: #242426;
  --surface-3: #2c2c2f;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text: #f5f5f7;
  --text-2: #a1a1a6;
  --text-3: #6e6e73;
  --accent: #0a84ff;
  --accent-strong: #409cff;
  --accent-soft: rgba(10, 132, 255, 0.18);
  --success: #32d74b;
  --danger: #ff453a;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-pop: 0 8px 30px rgba(0, 0, 0, 0.7);
  --checker-a: #242426;
  --checker-b: #1a1a1c;
}

/* ============================================================
   基础
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 240ms var(--ease), color 240ms var(--ease);
  overflow: hidden;
}

button { font-family: inherit; }

/* ============================================================
   应用骨架
   ============================================================ */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* ============================================================
   顶栏
   ============================================================ */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  height: 56px;
  flex: 0 0 56px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { display: grid; place-items: center; flex: 0 0 auto; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.brand-sub { font-size: 10.5px; font-weight: 500; color: var(--text-3); letter-spacing: 0.04em; }

.mode-switch { margin: 0 auto; }

/* 分段控件（顶栏模式切换 + 面板内） */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-3);
  border-radius: 999px;
  gap: 2px;
}
.seg {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 560;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 160ms var(--ease), background 200ms var(--ease), box-shadow 200ms var(--ease);
}
.seg:hover { color: var(--text); }
.seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-1);
}

.topbar-actions { display: flex; gap: 6px; margin-left: auto; }

.icon-btn {
  appearance: none;
  border: 0;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 999px;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background 160ms var(--ease), color 160ms var(--ease), transform 120ms var(--ease);
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn.small { width: 30px; height: 30px; flex: 0 0 auto; }

/* 主题图标切换 */
.i-sun { display: none; }
[data-theme="dark"] .i-sun { display: block; }
[data-theme="dark"] .i-moon { display: none; }

/* ============================================================
   工作区
   ============================================================ */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  gap: 20px;
  padding: 20px;
  min-height: 0;
}

/* ============================================================
   舞台
   ============================================================ */
.stage-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  min-height: 0;
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  background:
    linear-gradient(var(--surface), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* 预览画布（显示棋盘格以表达透明） */
.preview {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  image-rendering: auto;
  background-image:
    conic-gradient(var(--checker-a) 25%, var(--checker-b) 0 50%, var(--checker-a) 0 75%, var(--checker-b) 0);
  background-size: 18px 18px;
  border-radius: 4px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.14);
  opacity: 0;
  transition: opacity 260ms var(--ease), width 160ms var(--ease), height 160ms var(--ease);
}
.preview.show { opacity: 1; }

.video-src { display: none; }

/* ---------- 空状态 ---------- */
.dropzone {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px;
  text-align: center;
  max-width: 380px;
}
.dz-icon {
  width: 68px; height: 68px;
  border-radius: 22px;
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  margin-bottom: 4px;
  animation: floaty 3.4s ease-in-out infinite;
}
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.dz-title { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.dz-sub { font-size: 13.5px; color: var(--text-2); }

/* ---------- 拖拽悬停 ---------- */
.drag-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: var(--bg);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms var(--ease);
}
.drag-overlay.active { opacity: 1; }
.drag-card {
  padding: 22px 34px;
  background: var(--surface);
  border: 1.5px dashed var(--accent);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  box-shadow: var(--shadow-2);
  transform: scale(0.94);
  transition: transform 200ms var(--ease-spring);
}
.drag-overlay.active .drag-card { transform: scale(1); }
.drag-card-text { font-size: 15px; font-weight: 620; color: var(--text); }

/* ---------- 进度 ---------- */
.progress-overlay {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(8px);
}
.progress-overlay[hidden] { display: none; }
.progress-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 26px 40px;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow-2);
  min-width: 220px;
}
.ring { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface-3); stroke-width: 5; }
.ring-fill {
  fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
  stroke-dasharray: 175.93; /* 2πr = 2π·28 */
  stroke-dashoffset: 175.93;
  transition: stroke-dashoffset 180ms var(--ease);
}
.progress-label { font-size: 15px; font-weight: 640; }
.progress-sub { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------- 视频控制 ---------- */
.video-controls {
  position: absolute;
  left: 14px; bottom: 14px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px 6px 6px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(14px);
  border-radius: 999px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
}
.video-controls[hidden] { display: none; }
.play-btn {
  appearance: none;
  border: 0;
  width: 34px; height: 34px;
  border-radius: 999px;
  background: var(--text);
  color: var(--bg);
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform 120ms var(--ease), opacity 160ms var(--ease);
}
.play-btn:active { transform: scale(0.9); }
.play-btn .i-pause { display: none; }
.play-btn.playing .i-play { display: none; }
.play-btn.playing .i-pause { display: block; }
.time {
  font-size: 12.5px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  padding-right: 4px;
}

/* ============================================================
   输出条
   ============================================================ */
.output-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-1);
  animation: rise 320ms var(--ease-spring);
}
.output-bar[hidden] { display: none; }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.output-thumb {
  width: 52px; height: 52px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-3);
  flex: 0 0 auto;
  display: grid; place-items: center;
}
.output-thumb img, .output-thumb canvas {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.output-meta { flex: 1; min-width: 0; }
.output-title {
  font-size: 14px; font-weight: 620;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.output-stats {
  font-size: 12.5px; color: var(--text-2);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.output-actions { display: flex; gap: 8px; }
.output-done {
  color: var(--success);
  display: grid; place-items: center;
  animation: pop-check 520ms var(--ease-spring);
}
@keyframes pop-check {
  0% { opacity: 0; transform: scale(0.4); }
  60% { transform: scale(1.25); }
  100% { opacity: 1; transform: scale(1); }
}

/* ---------- 历史 ---------- */
.history {
  flex: 0 0 auto;
  display: flex;
  gap: 10px;
  padding: 2px 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.history[hidden] { display: none; }
.history::-webkit-scrollbar { height: 6px; }
.history::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }
.hist-item {
  position: relative;
  width: 58px; height: 58px;
  flex: 0 0 auto;
  border-radius: 11px;
  overflow: hidden;
  border: 2px solid transparent;
  background: var(--surface-3);
  cursor: pointer;
  transition: border-color 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
}
.hist-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-1); }
.hist-item.active { border-color: var(--accent); }
.hist-item img, .hist-item canvas { width: 100%; height: 100%; object-fit: cover; }
.hist-item .hist-tag {
  position: absolute; right: 3px; bottom: 3px;
  font-size: 9px; font-weight: 700;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  color: var(--text);
  padding: 1px 4px; border-radius: 5px;
}

/* ============================================================
   控制面板
   ============================================================ */
.controls-panel {
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.controls-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: thin;
}
.controls-scroll::-webkit-scrollbar { width: 8px; }
.controls-scroll::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 2px solid var(--surface); }

.control-group {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.control-group:first-child { padding-top: 0; }
.control-group[data-scope="video"].hidden-scope,
.control-group[data-scope="image"].hidden-scope { display: none; }

.group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.group-head h2 {
  font-size: 13px;
  font-weight: 620;
  letter-spacing: 0.01em;
  color: var(--text-2);
  text-transform: none;
}
.group-badge {
  font-size: 12px;
  font-weight: 560;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 9px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

/* ---------- 字段 ---------- */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field-row { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; }
.field-row:last-child { margin-bottom: 0; }
.field-row .field { flex: 1; margin-bottom: 0; }

.field-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 540;
}
.field-label .value {
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* ---------- 滑块 ---------- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  background: transparent;
  cursor: pointer;
  --track: var(--surface-3);
  --fill: var(--accent);
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 5px;
  border-radius: 99px;
  background: linear-gradient(to right, var(--fill) 0%, var(--fill) var(--p, 50%), var(--track) var(--p, 50%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  margin-top: -6.5px;
  border-radius: 50%;
  background: #fff;
  border: 0;
  box-shadow: 0 0 0 1px var(--border-strong), 0 2px 6px rgba(0,0,0,0.18);
  transition: transform 120ms var(--ease), box-shadow 120ms var(--ease);
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.18); }
input[type="range"]::-moz-range-track {
  height: 5px; border-radius: 99px; background: var(--track);
}
input[type="range"]::-moz-range-progress { height: 5px; border-radius: 99px; background: var(--fill); }
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 0;
  box-shadow: 0 0 0 1px var(--border-strong), 0 2px 6px rgba(0,0,0,0.18);
}
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 99px; }

/* 双滑块（裁剪）叠放在 track 上 */
.trim-track {
  position: relative;
  height: 5px;
  border-radius: 99px;
  background: var(--surface-3);
  margin-bottom: -11px;
}
.trim-fill {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  border-radius: 99px;
  background: var(--accent);
}
input[type="range"].range-dual {
  position: relative;
  display: block;
  margin-bottom: -22px;
  background: transparent;
  pointer-events: none;
  height: 22px;
}
input[type="range"].range-dual::-webkit-slider-thumb { pointer-events: auto; }
input[type="range"].range-dual::-moz-range-thumb { pointer-events: auto; }
input[type="range"].range-dual::-webkit-slider-runnable-track { background: transparent; }
input[type="range"].range-dual::-moz-range-track { background: transparent; }
.trim-hints {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 11.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ---------- chips ---------- */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 560;
  padding: 7px 13px;
  border-radius: 9px;
  cursor: pointer;
  transition: all 160ms var(--ease);
  white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.is-active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
}
.chip-add {
  border-style: dashed;
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}
.chip-add:hover { background: var(--accent-soft); border-color: var(--accent); }
.chip-custom { color: var(--text); }
.chip-x {
  display: inline-flex;

.chip-x:hover { background: var(--danger); color: #fff; }

.preset-save-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;

  flex: 1;
  min-width: 0;
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);

  font-size: 13px;

}
.preset-save-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.preset-save-row input::placeholder { color: var(--text-3); }
.btn.small { padding: 8px 13px; font-size: 13px; }

/* ---------- 尺寸自定义 ---------- */
.fit-row { margin-top: 14px; }
.dim-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}
.dim-row[hidden] { display: none; }
.dim-field {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
.dim-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dim-field span { font-size: 12px; color: var(--text-3); }

  border: 0; background: transparent;

  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);

  font-variant-numeric: tabular-nums;

.dim-x { color: var(--text-3); font-size: 14px; }

.switch-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 540;
  cursor: pointer;
  margin-top: 16px;
  user-select: none;
}
.switch { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-ui {
  position: relative;
  width: 44px; height: 26px;
  border-radius: 999px;
  background: var(--surface-3);
  transition: background 200ms var(--ease);
  flex: 0 0 auto;
  margin-left: auto;

.switch-ui::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);

.switch:checked + .switch-ui { background: var(--success); }

  font-size: 14px;

.btn-secondary { background: var(--surface-3); color: var(--text); }

      if (state.uppercase && /[a-zA-Z]/.test(text)) text = text.toUpperCase();
      let size = state.textSize;
      ctx.font = '900 ' + size + 'px ' + MEME_FONT;
      while (size > 6 && ctx.measureText(text).width > W - pad * 2) {
        size = Math.round(size * 0.94);
        ctx.font = '900 ' + size + 'px ' + MEME_FONT;
      }
      ctx.lineWidth = stroke;
      ctx.strokeStyle = state.textStrokeColor;
      ctx.fillStyle = state.textColor;
      if (stroke > 0) ctx.strokeText(text, W / 2, y);
      ctx.fillText(text, W / 2, y);
    };
    if (top) drawLine(top, pad + state.textSize * 0.55);
    if (bottom) drawLine(bottom, H - pad - state.textSize * 0.55);
  }

  /* ---------- 滤镜引擎 ---------- */
  const clampByte = (v) => (v < 0 ? 0 : (v > 255 ? 255 : Math.round(v)));

  function boxBlur(data, W, H, r) {
    if (r < 1) return;
    const tmp = new Uint8ClampedArray(data.length);
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        let sr = 0, sg = 0, sb = 0, sa = 0, n = 0;
        for (let dx = -r; dx <= r; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= W) continue;
          const i = (row + xx) * 4;
          sr += data[i]; sg += data[i + 1]; sb += data[i + 2]; sa += data[i + 3]; n++;
        }
        const o = (row + x) * 4;
        tmp[o] = sr / n; tmp[o + 1] = sg / n; tmp[o + 2] = sb / n; tmp[o + 3] = sa / n;
      }
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let sr = 0, sg = 0, sb = 0, sa = 0, n = 0;
        for (let dy = -r; dy <= r; dy++) {
          const yy = y + dy;
          if (yy < 0 || yy >= H) continue;
          const i = (yy * W + x) * 4;
          sr += tmp[i]; sg += tmp[i + 1]; sb += tmp[i + 2]; sa += tmp[i + 3]; n++;
        }
        const o = (y * W + x) * 4;
        data[o] = sr / n; data[o + 1] = sg / n; data[o + 2] = sb / n; data[o + 3] = sa / n;
      }
    }
  }

  function filterPixels(data, W, H, filter, t) {
    switch (filter) {
      case 'blur':
        boxBlur(data, W, H, Math.round(0.5 + t * 3.5));
        break;
      case 'sharpen': {
        const blurred = new Uint8ClampedArray(data);
        boxBlur(blurred, W, H, 1);
        const amount = 0.3 + t * 1.3;
        for (let i = 0; i < data.length; i += 4) {
          for (let c = 0; c < 3; c++) {
            data[i + c] = clampByte(data[i + c] + amount * (data[i + c] - blurred[i + c]));
          }
        }
        break;
      }
      case 'aged': {
        boxBlur(data, W, H, 1);
        const levels = Math.max(8, Math.round(48 - 40 * t));
        const step = 256 / levels;
        const desat = 0.5 * t, green = 10 * t, fade = 24 * t, contrast = 1 - 0.4 * t, noise = 16 * t;
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], g = data[i + 1], b = data[i + 2];
          r = Math.round(r / step) * step;
          g = Math.round(g / step) * step;
          b = Math.round(b / step) * step;
          const l = 0.299 * r + 0.587 * g + 0.114 * b;
          r = r + (l - r) * desat + green * 0.35;
          g = g + (l - g) * desat + green;
          b = b + (l - b) * desat - green * 0.25;
          r = (r - 128) * contrast + 128 + fade;
          g = (g - 128) * contrast + 128 + fade;
          b = (b - 128) * contrast + 128 + fade * 0.5;
          const n = (Math.random() * 2 - 1) * noise;
          data[i] = clampByte(r + n);
          data[i + 1] = clampByte(g + n);
          data[i + 2] = clampByte(b + n);
        }
        break;
      }
      case 'grayscale':
        for (let i = 0; i < data.length; i += 4) {
          const l = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          data[i] += (l - data[i]) * t;
          data[i + 1] += (l - data[i + 1]) * t;
          data[i + 2] += (l - data[i + 2]) * t;
        }
        break;
      case 'sepia':
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const sr = r * 0.393 + g * 0.769 + b * 0.189;
          const sg = r * 0.349 + g * 0.686 + b * 0.168;
          const sb = r * 0.272 + g * 0.534 + b * 0.131;
          data[i] = r + (sr - r) * t;
          data[i + 1] = g + (sg - g) * t;
          data[i + 2] = b + (sb - b) * t;
        }
        break;
      case 'saturate':
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const l = 0.299 * r + 0.587 * g + 0.114 * b;
          const s = 1 + t * 1.2;
          data[i] = clampByte(l + (r - l) * s);
          data[i + 1] = clampByte(l + (g - l) * s);
          data[i + 2] = clampByte(l + (b - l) * s);
        }
        break;
    }
  }

  function cssFilterFor() {
    if (state.filter === 'none') return 'none';
    const t = state.filterStrength / 100;
    switch (state.filter) {
      case 'blur': return 'blur(' + (0.5 + t * 4).toFixed(2) + 'px)';
      case 'grayscale': return 'grayscale(' + t.toFixed(2) + ')';
      case 'sepia': return 'sepia(' + t.toFixed(2) + ')';
      case 'saturate': return 'saturate(' + (1 + t * 1.2).toFixed(2) + ')';
      case 'sharpen': return 'contrast(' + (1 + t * 0.25).toFixed(2) + ') saturate(' + (1 + t * 0.2).toFixed(2) + ')';
      case 'aged': return 'saturate(' + (1 - t * 0.55).toFixed(2) + ') contrast(' + (1 - t * 0.42).toFixed(2) + ') brightness(' + (1 + t * 0.05).toFixed(2) + ') sepia(' + (t * 0.3).toFixed(2) + ')';
    }
    return 'none';
  }

  // 精确滤镜（编码 / 输出用），作用于离屏画布
  function applyFilterExact(ctx, W, H) {
    if (state.filter === 'none') return;
    const t = state.filterStrength / 100;
    if (state.filter === 'aged') {
      const sw = Math.max(2, Math.round(W / 4)), sh = Math.max(2, Math.round(H / 4));
      scratchCanvas.width = sw; scratchCanvas.height = sh;
      scratchCtx.clearRect(0, 0, sw, sh);
      scratchCtx.drawImage(ctx.canvas, 0, 0, W, H, 0, 0, sw, sh);
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(scratchCanvas, 0, 0, sw, sh, 0, 0, W, H);
    }
    const img = ctx.getImageData(0, 0, W, H);
    filterPixels(img.data, W, H, state.filter, t);
    ctx.putImageData(img, 0, 0);
  }

  // 预览用（GPU 加速，近似；锐化 / 包浆以输出为准）
  function drawPreviewFiltered(ctx, W, H, src, fit, bg) {
    ctx.filter = cssFilterFor();
    drawComposite(ctx, W, H, src, fit, bg);
    ctx.filter = 'none';
  }

  /* ---------- 预览舞台布局 / 渲染 ---------- */
  function layoutPreview() {
    const pad = 28;
    const availW = el.stage.clientWidth - pad * 2;
    const availH = el.stage.clientHeight - pad * 2;
    if (availW <= 0 || availH <= 0) return;
    const scale = Math.min(availW / state.w, availH / state.h, 2.5);
    el.preview.style.width = Math.max(1, Math.round(state.w * scale)) + 'px';
    el.preview.style.height = Math.max(1, Math.round(state.h * scale)) + 'px';
  }
  function ensurePreviewSize() {
    if (el.preview.width !== state.w || el.preview.height !== state.h) {
      el.preview.width = state.w;
      el.preview.height = state.h;
    }
    layoutPreview();
  }

  function renderCurrentFrame() {
    ensurePreviewSize();
    if (state.mode === 'video' && el.video.readyState >= 2) {
      drawPreviewFiltered(previewCtx, state.w, state.h, el.video, state.fit);
    }
    el.preview.classList.add('show');
    el.dropzone.style.display = 'none';
  }

  function renderStaticPreview() {
    ensurePreviewSize();
    const src = state.image && state.image.bmp;
    if (src) drawPreviewFiltered(previewCtx, state.w, state.h, src, state.fit, state.format === 'jpeg' ? '#ffffff' : null);
    el.preview.classList.add('show');
    el.dropzone.style.display = 'none';
  }

  /* ---------- 预览循环（视频播放） ---------- */
  let rafId = null;
  function startPreviewLoop() {
    if (state.mode !== 'video' || !state.hasVideo) return;
    if (!state.previewStopped) return; // 已在运行
    state.previewStopped = false;
    const loop = () => {
      if (state.previewStopped) return;
      const v = el.video;
      if (v.readyState >= 2 && !v.paused && !v.seeking) {
        if (state.trimEnd > 0 && v.currentTime > state.trimEnd) v.currentTime = state.trimStart;
        drawPreviewFiltered(previewCtx, state.w, state.h, v, state.fit);
      }
      rafId = requestAnimationFrame(loop);
    };
    rafId = requestAnimationFrame(loop);
  }
  function stopPreviewLoop() {
    state.previewStopped = true;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ---------- 视频时长 ---------- */
  function videoDuration() {
    const d = el.video.duration;
    return Number.isFinite(d) ? d : 0;
  }

  /* ---------- 文件导入 ---------- */
  const VIDEO_EXT = /\.(mp4|mov|webm|mkv|avi|m4v|ogv|mpeg|mpg)$/i;
  const IMAGE_EXT = /\.(png|jpe?g|webp|gif|bmp|avif)$/i;
  function detectKind(file) {
    if (file.type.startsWith('video/')) return 'video';
    if (file.type.startsWith('image/')) return 'image';
    if (VIDEO_EXT.test(file.name)) return 'video';
    if (IMAGE_EXT.test(file.name)) return 'image';
    return null;
  }

  el.pickFile.addEventListener('click', () => el.fileInput.click());
  el.fileInput.addEventListener('change', () => {
    if (el.fileInput.files.length) handleFiles([...el.fileInput.files]);
    el.fileInput.value = '';
  });

  function handleFiles(files) {
    const vids = files.filter((f) => detectKind(f) === 'video');
    const imgs = files.filter((f) => detectKind(f) === 'image');
    if (vids.length) { switchMode('video'); loadVideoFile(vids[0]); }
    else if (imgs.length) { switchMode('image'); loadImageFiles(imgs); }
    else toast('不支持的文件类型', true);
  }

  /* ---------- 拖拽 ---------- */
  let dragDepth = 0;
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => { e.preventDefault(); });

  el.stage.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    el.dragOverlay.classList.add('active');
  });
  el.stage.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el.dragOverlay.classList.remove('active');
  });
  el.stage.addEventListener('dragover', (e) => e.preventDefault());
  el.stage.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    el.dragOverlay.classList.remove('active');
    if (e.dataTransfer && e.dataTransfer.files.length) {
      handleFiles([...e.dataTransfer.files]);
    }
  });

  /* ---------- 视频处理 ---------- */
  async function loadVideoFile(file) {
    state.cancelRequested = false;
    if (state.encoding) {
      state.cancelRequested = true;
      const t0 = Date.now();
      while (state.encoding && Date.now() - t0 < 3000) await nextTick();
    }
    const url = URL.createObjectURL(file);
    const v = el.video;
    v.muted = true;
    v.setAttribute('muted', '');
    v.src = url;
    try {
      await waitEvent(v, 'loadedmetadata', 15000);
      await waitEvent(v, 'loadeddata', 15000);
    } catch (err) {
      toast('无法解码该视频：' + err.message, true);
      return;
    }
    const dur = videoDuration();
    state.trimEnd = dur > 0 ? dur : 5;
    state.trimStart = 0;
    state.hasVideo = true;
    state.hasImage = false;
    state._videoName = file.name;
    updateTrimUI();
    showStageMedia();
    v.play().catch(() => {});
    startPreviewLoop();
    toast('已导入 · 正在自动转 GIF');
    encodeVideo(file.name);
  }

  function showStageMedia() {
    el.dropzone.style.display = 'none';
    el.videoControls.hidden = false;
    ensurePreviewSize();
    el.preview.classList.add('show');
  }

  function seekVideo(time) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        el.video.removeEventListener('seeked', finish);
        clearTimeout(to);
        resolve();
      };
      const to = setTimeout(finish, 4000);
      el.video.addEventListener('seeked', finish);
      try { el.video.currentTime = time; } catch (e) { finish(); return; }
      if (Math.abs(el.video.currentTime - time) < 0.015) finish();
    });
  }

  function transparentIndex(palette) {
    for (let i = 0; i < palette.length; i++) {
      const c = palette[i];
      if (c && c.length >= 4 && c[3] === 0) return i;
    }
    return -1;
  }

  async function encodeVideo(name) {
    if (state.encoding) return;
    if (!state.hasVideo) return;
    if (!GIFEncoder || !quantize || !applyPalette) {
      toast('GIF 编码器加载失败', true);
      return;
    }
    const W = state.w, H = state.h;
    const start = state.trimStart, end = state.trimEnd;
    const dur = Math.max(0.05, end - start);
    const fps = state.fps, speed = state.speed, loop = state.loop, reverse = state.reverse;
    const isContain = state.fit === 'contain';

    let n = Math.round(dur * fps);
    if (n < 1) n = 1;
    let step = 1 / fps;
    if (n > MAX_FRAMES) { n = MAX_FRAMES; step = dur / n; }
    const times = [];
    for (let i = 0; i < n; i++) times.push(start + i * step + step / 2);
    if (reverse) times.reverse();

    state.encoding = true;
    state.cancelRequested = false;
    setBusy(true);
    showProgress(true);
    el.video.pause();
    stopPreviewLoop();

    const gif = GIFEncoder();
    const delay = Math.max(20, Math.round(1000 / (fps * speed)));
    const format = isContain ? 'rgba4444' : 'rgb565';

    try {
      workCanvas.width = W; workCanvas.height = H;
      let first = true;
      for (let i = 0; i < times.length; i++) {
        if (state.cancelRequested) break;
        await seekVideo(clamp(times[i], 0, Math.max(0, videoDuration() - 0.001)));
        drawComposite(workCtx, W, H, el.video, state.fit);
        applyFilterExact(workCtx, W, H);
        const img = workCtx.getImageData(0, 0, W, H);
        const palette = quantize(img.data, state.colors, { format, oneBitAlpha: isContain });
        const index = applyPalette(img.data, palette, format);
        const tIdx = isContain ? transparentIndex(palette) : -1;
        gif.writeFrame(index, W, H, {
          palette,
          delay,
          repeat: first ? loop : 0,
          transparent: tIdx >= 0,
          transparentIndex: Math.max(tIdx, 0),
          dispose: 2,
        });
        first = false;
        updateProgress(i + 1, times.length);
        await yieldUI();
      }
      if (state.cancelRequested) {
        toast('已取消');
        return;
      }
      gif.finish();
      const blob = new Blob([gif.bytes()], { type: 'image/gif' });
      showResult(blob, renameExt(name, 'gif'), 'gif', {
        width: W, height: H, frames: times.length, duration: dur,
      });
      toast('GIF 生成完成 🎉');
    } catch (err) {
      console.error(err);
      toast('转码失败：' + err.message, true);
    } finally {
      state.encoding = false;
      state.cancelRequested = false;
      setBusy(false);
      showProgress(false);
      if (state.mode === 'video') { el.video.play().catch(() => {}); startPreviewLoop(); }
    }
  }

  /* ---------- 图片处理 ---------- */
  function loadBitmap(file) {
    if ('createImageBitmap' in window) {
      return createImageBitmap(file).catch(() => loadImageElement(file));
    }
    return loadImageElement(file);
  }
  function loadImageElement(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('图片解码失败'));
      img.src = url;
    });
  }

  async function loadImageFiles(files) {
    const entries = [];
    for (const f of files) {
      try { entries.push({ bmp: await loadBitmap(f), name: f.name }); }
      catch (e) { toast('无法读取：' + f.name, true); }
    }
    if (!entries.length) return;
    state.hasImage = true;
    state.hasVideo = false;
    state.imageList = entries;
    state.image = entries[0];
    el.videoControls.hidden = true;
    stopPreviewLoop();
    renderStaticPreview();

    const results = [];
    for (const entry of entries) {
      const res = await processImage(entry);
      if (res) results.push(res);
    }
    if (!results.length) return;
    showResult(results[0].blob, results[0].name, results[0].type, { width: state.w, height: state.h });
    for (let i = 1; i < results.length; i++) {
      const r = results[i];
      addHistory(buildResult(r.blob, r.name, r.type, { width: state.w, height: state.h }));
    }
    toast(entries.length > 1 ? '已批量压缩 ' + entries.length + ' 张图片' : '图片已缩放');
  }

  async function processImage(entry) {
    const W = state.w, H = state.h, fmt = state.format, q = state.quality;
    workCanvas.width = W; workCanvas.height = H;
    drawComposite(workCtx, W, H, entry.bmp, state.fit, fmt === 'jpeg' ? '#ffffff' : null);
    applyFilterExact(workCtx, W, H);
    const mime = fmt === 'png' ? 'image/png' : fmt === 'jpeg' ? 'image/jpeg' : 'image/webp';
    try {
      const blob = await new Promise((res) => workCanvas.toBlob(res, mime, fmt === 'png' ? undefined : q));
      if (!blob) return null;
      return { blob, name: renameExt(entry.name, fmt), type: fmt, entry };
    } catch (e) {
      return null;
    }
  }

  function scheduleImageReprocess() {
    clearTimeout(state._imgTimer);
    state._imgTimer = setTimeout(async () => {
      if (state.mode !== 'image' || !state.hasImage || !state.image) return;
      const res = await processImage(state.image);
      if (res) showResult(res.blob, res.name, res.type, { width: state.w, height: state.h }, { pushHistory: false });
    }, 260);
  }

  /* ---------- 进度 / 忙碌 ---------- */
  const RING_C = 175.93;
  function showProgress(show) {
    el.progressOverlay.hidden = !show;
    if (show) updateProgress(0, 1);
  }
  function updateProgress(done, total) {
    const p = total ? done / total : 0;
    el.ringFill.style.strokeDashoffset = String(RING_C * (1 - p));
    el.progressLabel.textContent = '正在转码…';
    el.progressSub.textContent = done + ' / ' + total + ' 帧 · ' + Math.round(p * 100) + '%';
  }
  function setBusy(busy) {
    el.generateBtn.classList.toggle('busy', busy);
    el.generateBtn.disabled = busy;
  }
  el.cancelBtn.addEventListener('click', () => {
    if (state.encoding) state.cancelRequested = true;
  });
  el.generateBtn.addEventListener('click', () => {
    if (state.encoding) return;
    if (state.mode === 'video') {
      if (!state.hasVideo) { toast('请先拖入一段视频', true); return; }
      encodeVideo(state._videoName || 'output');
    } else {
      if (!state.hasImage) { toast('请先拖入一张图片', true); return; }
      (async () => {
        setBusy(true);
        const res = await processImage(state.image);
        if (res) showResult(res.blob, res.name, res.type, { width: state.w, height: state.h });
        setBusy(false);
      })();
    }
  });

  /* ---------- 结果 / 输出条 ---------- */
  function makeImg(url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.draggable = false;
    return img;
  }
  function resultStats(r) {
    const parts = [r.meta.width + '×' + r.meta.height, fmtBytes(r.blob.size)];
    if (r.type === 'gif' && r.meta.frames) {
      parts.push(r.meta.frames + ' 帧', fmtSec(r.meta.duration));
    }
    return parts.join(' · ');
  }
  function buildResult(blob, name, type, meta) {
    return { blob, url: URL.createObjectURL(blob), type, name, meta, ts: Date.now(), live: false };
  }
  function renderOutputBar() {
    const r = state.result;
    if (!r) return;
    el.outputThumb.innerHTML = '';
    el.outputThumb.appendChild(makeImg(r.url));
    el.outputTitle.textContent = r.name;
    el.outputStats.textContent = resultStats(r);
    el.outputBar.hidden = false;
  }
  function flashDone() {
    el.outputDone.style.animation = 'none';
    void el.outputDone.offsetWidth;
    el.outputDone.style.animation = '';
  }

  function showResult(blob, name, type, meta, opts = {}) {
    const flash = opts.flash !== false;
    const pushHistory = opts.pushHistory !== false;
    const result = buildResult(blob, name, type, meta);
    result.live = !pushHistory;
    if (state.result && state.result.live && state.result.url) {
      URL.revokeObjectURL(state.result.url);
    }
    state.result = result;
    renderOutputBar();
    if (flash) flashDone();
    if (pushHistory) {
      addHistory(result);
      highlightHistory(result);
    }
  }

  /* ---------- 历史 ---------- */
  function addHistory(result) {
    state.history = state.history.filter((h) => h !== result);
    state.history.unshift(result);
    while (state.history.length > 14) {
      const gone = state.history.pop();
      if (gone && gone !== state.result) URL.revokeObjectURL(gone.url);
    }
    renderHistory();
  }
  function highlightHistory(result) {
    [...el.history.children].forEach((c, i) => c.classList.toggle('active', state.history[i] === result));
  }
  function renderHistory() {
    el.history.innerHTML = '';
    el.history.hidden = state.history.length === 0;
    state.history.forEach((r) => {
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.title = r.name;
      const img = makeImg(r.url);
      item.appendChild(img);
      const tag = document.createElement('span');
      tag.className = 'hist-tag';
      tag.textContent = r.type === 'gif' ? 'GIF' : r.type.toUpperCase();
      item.appendChild(tag);
      item.addEventListener('click', () => setActiveResult(r));
      el.history.appendChild(item);
    });
  }
  function setActiveResult(r) {
    state.result = r;
    renderOutputBar();
    highlightHistory(r);
    toast('已选中：' + r.name);
  }

  /* ---------- 下载 / 复制 ---------- */
  el.downloadBtn.addEventListener('click', () => {
    const r = state.result;
    if (!r) return;
    const a = document.createElement('a');
    a.href = r.url;
    a.download = r.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已开始下载');
  });
  el.copyBtn.addEventListener('click', async () => {
    const r = state.result;
    if (!r) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ [r.blob.type]: r.blob })]);
      toast('已复制到剪贴板');
    } catch (e) {
      toast('当前浏览器不支持复制该格式，请使用下载', true);
    }
  });

  /* ---------- 播放控制 ---------- */
  el.playBtn.addEventListener('click', () => {
    const v = el.video;
    if (v.paused) v.play().catch(() => {});
    else v.pause();
  });
  el.video.addEventListener('play', () => { el.playBtn.classList.add('playing'); startPreviewLoop(); });
  el.video.addEventListener('pause', () => el.playBtn.classList.remove('playing'));
  el.video.addEventListener('ended', () => el.playBtn.classList.remove('playing'));
  el.video.addEventListener('timeupdate', () => {
    el.timeLabel.textContent = fmtClock(el.video.currentTime) + ' / ' + fmtClock(videoDuration());
  });

  window.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space' && state.mode === 'video' && state.hasVideo) {
      e.preventDefault();
      el.playBtn.click();
    }
  });

  /* ---------- 舞台尺寸 ---------- */
  let resizeObs = null;
  if ('ResizeObserver' in window) {
    resizeObs = new ResizeObserver(() => layoutPreview());
    resizeObs.observe(el.stage);
  } else {
    window.addEventListener('resize', layoutPreview);
  }

  /* ---------- 设置持久化 ---------- */
  function collectSettings() {
    return {
      mode: state.mode,
      w: state.w, h: state.h,
      sizePreset: state.sizePreset,
      fit: state.fit,
      fps: state.fps,
      colors: state.colors,
      speed: state.speed,
      loop: state.loop,
      reverse: state.reverse,
      format: state.format,
      quality: state.quality,
      filter: state.filter,
      filterStrength: state.filterStrength,
      textTop: state.textTop, textBottom: state.textBottom,
      textSize: state.textSize, textStroke: state.textStroke,
      textColor: state.textColor, textStrokeColor: state.textStrokeColor,
      uppercase: state.uppercase,
    };
  }
  let _saveTimer = null;
  function scheduleSave() {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
      try { localStorage.setItem('gifstudio-settings', JSON.stringify(collectSettings())); } catch (e) {}
    }, 300);
  }
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('gifstudio-settings') || 'null');
      if (s && typeof s === 'object') {
        Object.keys(s).forEach((k) => { if (k in state) state[k] = s[k]; });
      }
    } catch (e) {}
  }
  function refreshSlider(input) {
    const min = +input.min, max = +input.max, v = +input.value;
    input.style.setProperty('--p', (((v - min) / (max - min)) * 100) + '%');
  }
  function syncControls() {
    el.fps.value = state.fps; el.fpsVal.textContent = state.fps + ' fps'; refreshSlider(el.fps);
    el.colorsVal.textContent = state.colors;
    el.speed.value = state.speed; el.speedVal.textContent = formatSpeed(state.speed); refreshSlider(el.speed);
    el.textSize.value = state.textSize; el.textSizeVal.textContent = state.textSize; refreshSlider(el.textSize);
    el.textStroke.value = state.textStroke; el.textStrokeVal.textContent = state.textStroke; refreshSlider(el.textStroke);
    el.quality.value = state.quality; el.qualityVal.textContent = Math.round(state.quality * 100) + '%'; refreshSlider(el.quality);
    el.filterStrength.value = state.filterStrength; el.filterStrengthVal.textContent = state.filterStrength + '%'; refreshSlider(el.filterStrength);
    el.textTop.value = state.textTop;
    el.textBottom.value = state.textBottom;
    el.textColor.value = state.textColor;
    el.textStrokeColor.value = state.textStrokeColor;
    el.uppercase.checked = state.uppercase;
    el.reverse.checked = state.reverse;
    renderSizeChips();
    renderColorChips();
    renderLoopChips();
    renderFormatChips();
    renderFilterChips();
    syncDimInputs();
    updateTrimUI();
  }

  /* ---------- 初始化 ---------- */
  function init() {
    initTheme();
    loadCustomPresets();
    loadSettings();
    syncControls();
    el.modeSegs.forEach((s) => {
      const active = s.dataset.mode === state.mode;
      s.classList.toggle('is-active', active);
      s.setAttribute('aria-selected', active);
    });
    el.qualityField.hidden = state.format === 'png';
    el.filterStrengthField.hidden = state.filter === 'none';
    el.dimRow.hidden = state.sizePreset !== 'custom';
    applyModeScope();
    updateDropzone();
    updateGenerateLabel();
    el.footNote.textContent = '帧率越低、颜色越少，文件越小 · 微信表情建议 ≤ 1MB';
    el.preview.width = state.w;
    el.preview.height = state.h;
  }
  init();
})();

</script>
</body>
</html>
